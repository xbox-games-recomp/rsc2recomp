; Settings for the recomp launcher (launcher\ submodule, built as rsc2_launcher.exe).
; Format: launcher\README.md. Your choices are saved to launcher.user.ini (not committed).

[game]
title=RalliSport Challenge 2
subtitle=Static recompilation (original Xbox)
exe=build\Release\rsc2_recomp.exe
workdir={root}
stderr_log=run.log
stdout_log=run.log

[require]
game_files\default.xbe=Extract your disc into game_files\ first, see README.md.

[env]
; Needed for the game to run at all (README.md "Running").
; Audio codec reported ready so the XDK's DirectSoundCreate succeeds.
RECOMP_AC97_READY=1
; GPU renderer (src\d3d11_backend.c) and push-buffer execution.
RECOMP_D3D11=1
RECOMP_PB_EXEC=1
; Reuse freed memory (the toolkit ignores frees by default, which exhausts the 64 MB arena).
RECOMP_HEAP_RECLAIM=1
; One thread at DISPATCH_LEVEL at a time, DPCs included (mm3recomp NOTES 31).
RECOMP_DISPATCH_GATE=1

[setting.res]
group=Graphics
label=Internal resolution
type=choice
env=RECOMP_D3D11_RES
choices=1:1x  640x480 (console)|2:2x  1280x960|3:3x  1920x1440|4:4x  2560x1920|5:5x  3200x2400|6:6x  3840x2880
default=2
help=Above the window size the image is averaged down (supersampling AA). The window can be resized and keeps 4:3.

[setting.fxaa]
group=Graphics
label=FXAA edge smoothing
type=bool
env=RECOMP_D3D11_FXAA
default=0

[setting.vsync]
group=Graphics
label=Vertical sync
type=bool
env=RECOMP_D3D11_VSYNC
on=1
off=0
default=1

[setting.keyboard]
group=Input
label=Keyboard controls
type=bool
env=RECOMP_KEYBOARD
default=1
help=Arrows = D-pad, Enter = Start, Z/X/C/V = A/B/X/Y, WASD = left stick, 1/3 = triggers. XInput pads always work.

[setting.rumble]
group=Input
label=Rumble
type=bool
env=RECOMP_RUMBLE
on=1
off=0
default=1

[setting.stub_log]
group=Logging
label=Log unresolved functions
type=bool
env=RECOMP_STUB_LOG
default=1
help=Logs each unresolved-function stub the first time it is reached.

[setting.hitch]
group=Logging
label=Hitch log
type=choice
env=RECOMP_D3D11_HITCH
choices=:Off|33:Frames over 33 ms|60:Frames over 60 ms|100:Frames over 100 ms
default=60
help=A [HITCH] line for every slow frame, with the texture / shader-compile time spent in it.

[setting.watchdog]
group=Logging
label=Hang watchdog
type=choice
env=RECOMP_WATCHDOG_SECS
choices=:Off|60:After 60 s|300:After 5 min|900:After 15 min
default=900
help=Writes a state dump to the log if the game stops making progress this long.

[setting.ring]
group=Debug
label=Flight recorder
type=choice
env=RECOMP_D3D11_RING
choices=:Off|120:Last 120 frames (4 s)|240:Last 240 frames (8 s)
default=240
help=F12 in the game window saves the recorded frames to flicker\<date_time>\. 240 frames use about 1.2 GB of video memory at 2x and 900 MB of BMPs per save.
